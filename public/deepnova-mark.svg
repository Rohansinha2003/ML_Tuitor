<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="deepnova-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <linearGradient id="deepnova-nova" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="deepnova-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#deepnova-bg)" />
  <rect x="1" y="1" width="46" height="46" rx="11" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Neural connection ring -->
  <circle cx="24" cy="24" r="14" stroke="#818cf8" stroke-opacity="0.25" stroke-dasharray="3 3" />
  
  <!-- Central 4-pointed glowing nova star -->
  <path d="M24 7 L26.8 19.5 L39 24 L26.8 28.5 L24 41 L21.2 28.5 L9 24 L21.2 19.5 Z" fill="url(#deepnova-nova)" filter="url(#deepnova-glow)" />
  
  <!-- Diagonal energy bursts -->
  <path d="M24 16 L25.5 22.5 L32 24 L25.5 25.5 L24 32 L22.5 25.5 L16 24 L22.5 22.5 Z" fill="#ffffff" fill-opacity="0.9" />
  
  <!-- Core synapse dot -->
  <circle cx="24" cy="24" r="3" fill="#ffffff" />
  
  <!-- Orbiting neural nodes -->
  <circle cx="34" cy="14" r="2" fill="#38bdf8" />
  <circle cx="14" cy="34" r="2" fill="#c084fc" />
</svg>
